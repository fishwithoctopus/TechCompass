name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:win
        env:
          # 打包机在国内时可启用镜像
          ELECTRON_MIRROR: ${{ vars.ELECTRON_MIRROR }}
      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TechCompass-Setup-*.exe
            dist/techcompass-*.zip
          generate_release_notes: true
          draft: true

  build-macos:
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload macOS preview installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TechCompass-*-mac-${{ matrix.arch }}.dmg
            dist/TechCompass-*-mac-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
          draft: true
