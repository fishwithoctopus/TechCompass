name: macOS preview build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-preview:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run gen:icon
      - name: Build preview without publishing
        run: npm run dist:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: TechCompass-mac-${{ matrix.arch }}-preview
          path: |
            dist/TechCompass-*-mac-${{ matrix.arch }}.dmg
            dist/TechCompass-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
